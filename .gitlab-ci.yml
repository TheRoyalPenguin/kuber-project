stages:
  - build
  - test
  - deploy

build-job:
  tags:
    - docker
  stage: build
  before_script:
    - echo "start before_script in build stage"
  variables:
    var1: "1"
    var2: "123"
  script:
    - echo "Start build"
    - echo $var1
    - echo $var2

test-job:
  tags:
    - docker
  stage: test
  after_script:
    - echo "start after_script in test stage"
  script:
    - echo "Start TEST stage"

deploy-job:
  tags:
    - docker
  stage: deploy
  only:
    - merge_request
  script:
    - echo "Start deploy"
