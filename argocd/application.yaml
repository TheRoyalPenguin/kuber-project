apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sre-practice-app
  namespace: argocd
spec:
  project: default
  source:
#    repoURL: https://gitlab.kzp.in/itis-devops/sharafutdinovaa.git
    repoURL: https://github.com/TheRoyalPenguin/kuber-project.git
    targetRevision: kuber-project
    path: charts/myapp
    helm:
      # Это заставит Helm скачать зависимость Redis перед деплоем
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
